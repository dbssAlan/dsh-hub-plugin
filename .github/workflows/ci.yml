name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        shell: bash
        run: |
          node --check index.js
          node --check client.js
          node --check lib/hub-cli.mjs
          node --check scripts/test.mjs
      - name: End-to-end tests (login / tokens / proxy / SSRF / rate limit)
        shell: bash
        run: node scripts/test.mjs
